name: Data & Code Validity Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'api/**'
      - 'data/**'
      - 'pipeline/**'
      - '.github/**'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'api/**'
      - 'data/**'
      - 'pipeline/**'
      - '.github/**'

permissions:
  contents: read

jobs:
  code-and-data-validity:
    name: Code Quality, Data Integrity & Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js Toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Run ESLint Code Quality Check
        run: npm run lint

      - name: Run Prettier Formatting Check
        run: npm run format:check

      - name: Setup Python Pipeline Toolchain
        uses: ./.github/actions/setup-pipeline

      - name: Run Python Formatting & Imports (Black & isort)
        run: |
          isort --check-only api pipeline
          black --check api pipeline

      - name: Run Code Quality Linting (Flake8 & Ruff)
        run: |
          flake8 api pipeline
          ruff check .

      - name: Run Security Audit (Bandit)
        run: bandit -c pyproject.toml -r api/ pipeline/

      - name: Run Documentation Linter (Doc8)
        run: doc8 --max-line-length 112 --file-encoding utf-8 docs/ README.md CONTRIBUTING.md

      - name: Run Data Integrity & Zero-PII Validator
        run: python pipeline/validate_data.py

      - name: Run Pytest Suite
        run: pytest api/tests/ pipeline/tests/ -v --tb=short


