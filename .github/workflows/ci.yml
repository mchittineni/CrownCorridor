name: Data Validity Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  data-validity:
    name: Data Integrity & Pipeline Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Pipeline Toolchain
        uses: ./.github/actions/setup-pipeline

      - name: Run Data Integrity Validator
        run: python pipeline/validate_data.py

      - name: Run Pytest Suite
        run: pytest pipeline/tests/ -v --tb=short
