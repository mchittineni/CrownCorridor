name: Data & Code Validity Tests

on:
  pull_request:
    types: [opened,synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-and-data-validity:
    name: Code Quality, Data Integrity & Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python Pipeline Toolchain
        uses: ./.github/actions/setup-pipeline

      - name: Run Python Formatting & Linting (Ruff & Flake8)
        run: |
          ruff check .
          ruff format --check .
          flake8 security_framework evaluation experiments benchmark scripts

      - name: Run Security Audit (Bandit)
        run: bandit -c pyproject.toml -r security_framework/ evaluation/ experiments/ benchmark/ scripts/

      - name: Run Pytest Suite & Coverage
        run: pytest security_framework/tests/ evaluation/tests/ -v --tb=short --cov=security_framework

      - name: Check Corpus Admissibility (structural)
        run: python -m evaluation.corpus --report --mode structural

      - name: Verify Fabricating Stages Refuse Without Explicit Opt-In
        run: |
          set -u
          status=0
          for module in evaluation/score.py experiments/generate_charts.py; do
            if python "$module" >/dev/null 2>&1; then
              echo "::error file=${module}::ran without IACSECBENCH_ALLOW_SYNTHETIC=1; the synthetic guard is not in effect"
              status=1
            else
              echo "ok: ${module} refuses by default"
            fi
          done
          exit "$status"
