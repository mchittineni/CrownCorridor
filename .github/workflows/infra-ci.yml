name: Infrastructure & Policy Validation (IaC CI)

on:
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure/**'
      - 'security_framework/**'
      - 'benchmark/**'
      - 'evaluation/**'
      - 'leaderboard/**'
      - 'experiments/**'
      - 'pipeline/validate_iac.py'
      - 'pipeline/tests/test_validate_iac.py'
      - '.github/workflows/infra-ci.yml'
  push:
    branches: [main]
    paths:
      - 'infrastructure/**'
      - 'security_framework/**'
      - 'benchmark/**'
      - 'evaluation/**'
      - 'leaderboard/**'
      - 'experiments/**'
      - 'pipeline/validate_iac.py'
      - 'pipeline/tests/test_validate_iac.py'
      - '.github/workflows/infra-ci.yml'

concurrency:
  group: infra-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  iac-validation:
    name: Terraform Validation, Policy Checks & IaC Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.0"

      - name: Setup Python Toolchain
        uses: ./.github/actions/setup-pipeline

      - name: Terraform Format Check
        run: terraform fmt -check -recursive infrastructure/

      - name: Terraform Init & Validate
        run: |
          cd infrastructure
          terraform init -backend=false
          terraform validate

      - name: Run Native Terraform Tests
        run: |
          cd infrastructure
          terraform test

      - name: Run IaC & CIS Benchmark Policy Validator
        run: python pipeline/validate_iac.py

      # Conftest embeds Rego but does not expose `opa check` or `opa fmt`, and the
      # benchmark harness shells out to `opa` by name. Both binaries are needed.
      - name: Install OPA
        run: |
          set -eu
          # Pinned to the version recorded in results/run_manifest.json. 1.9.0 is a
          # different, older release than 1.19.0 -- easy to transpose, and it would
          # silently measure a different engine than the published results.
          OPA_VERSION="1.19.0"
          curl -fsSL "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static" -o opa
          chmod +x opa
          sudo mv opa /usr/local/bin/
          opa version

      - name: Install Conftest (OPA)
        run: |
          CONFTEST_VERSION="0.68.2"
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" -o conftest.tar.gz
          tar xzf conftest.tar.gz conftest
          sudo mv conftest /usr/local/bin/

      - name: Run OPA Rego Policy Check (Conftest)
        run: |
          cd infrastructure
          terraform init -backend=false
          terraform plan -out=tfplan.binary
          terraform show -json tfplan.binary > tfplan.json
          conftest test tfplan.json --policy policies/cis_aws_benchmark.rego --namespace aws.cis.benchmark

      - name: Run Checkov Security Scan
        run: |
          pip install checkov
          checkov --config-file .checkov.yaml

      # Two policy sets exist and are NOT copies of one another:
      #   infrastructure/policies/      evaluated by conftest against the real plan
      #   security_framework/policies/  evaluated by the benchmark harness, and the
      #                                 only one that emits rule_id fields for the
      #                                 finding-normalization engine
      # Both are parsed and format-checked here. `opa check` matters because a Rego
      # file that fails to parse does not fail loudly -- an earlier revision of the
      # benchmark policy used constructs invalid in Rego v1, so that layer silently
      # never executed and scored as a total miss on every case.
      - name: Validate Rego Policy Sets (parse + format)
        run: |
          set -eu
          for dir in infrastructure/policies security_framework/policies; do
            opa check "$dir"
            echo "ok: ${dir} parses"
          done
          if [ -n "$(opa fmt --list infrastructure/policies security_framework/policies)" ]; then
            echo "::error::Rego files are not canonically formatted; run: opa fmt -w infrastructure/policies security_framework/policies"
            opa fmt --diff infrastructure/policies security_framework/policies
            exit 1
          fi
          echo "ok: all Rego files canonically formatted"

      # Authoritative corpus admissibility. Terraform mode runs init and validate
      # per case, the only check that catches a case referencing a resource type the
      # provider does not define. ci.yml runs the fast structural variant; this job
      # has the CLI, so it runs the real one.
      - name: Check Corpus Admissibility (terraform)
        run: python -m evaluation.corpus --report --mode terraform

      # IACSECBENCH_ALLOW_SYNTHETIC is deliberately NOT set: tests that exercise a
      # fabricating stage opt in per test, and one test asserts those stages refuse
      # without it.
      - name: Run Full Pytest Suite (Includes IaC & Policy Unit Tests)
        run: pytest security_framework/tests/ pipeline/tests/ evaluation/tests/ -v --tb=short

      # The measurement harness is not run on pull requests. It executes four
      # scanners over every admissible case with repeats, takes tens of minutes, and
      # its latency column is meaningless on a shared runner. benchmark.yml runs it
      # on demand. What this job verifies instead is that the harness is wired
      # correctly: that it discovers tools and reports absent ones as absent rather
      # than inventing results for them.
      - name: Verify Measurement Harness Wiring (no scan)
        run: python -m evaluation.run_baselines --list-tools
