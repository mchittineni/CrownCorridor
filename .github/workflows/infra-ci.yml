name: Infrastructure & Policy Validation (IaC CI)

on:
  pull_request:
    paths:
      - 'terraform/**'
      - 'pipeline/validate_iac.py'
      - 'pipeline/tests/test_validate_iac.py'
      - '.github/workflows/infra-ci.yml'
  push:
    paths:
      - 'terraform/**'
      - 'pipeline/validate_iac.py'
      - 'pipeline/tests/test_validate_iac.py'
      - '.github/workflows/infra-ci.yml'
    branches: [main]

permissions:
  contents: read

jobs:
  iac-validation:
    name: Terraform Validation, Policy Checks & IaC Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.0"

      - name: Setup Python Toolchain
        uses: ./.github/actions/setup-pipeline

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/

      - name: Terraform Init & Validate
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate

      - name: Run Native Terraform Tests
        run: |
          cd terraform
          terraform test

      - name: Run IaC & CIS Benchmark Policy Validator
        run: python pipeline/validate_iac.py

      - name: Run Full Pytest Suite (Includes IaC & Policy Unit Tests)
        run: pytest pipeline/tests/ -v --tb=short
