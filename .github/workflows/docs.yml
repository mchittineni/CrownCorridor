name: Docs Build Check

on:
  push:
    branches: [main]
    paths:
      - 'application/app/portal.js'
      - 'application/app/**'
      - 'jsdoc.json'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'application/app/portal.js'
      - 'application/app/**'
      - 'jsdoc.json'
      - 'docs/**'
      - '.github/workflows/docs.yml'

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jsdoc-build:
    name: JSDoc Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build JSDoc API Reference
        run: npx jsdoc -c jsdoc.json --pedantic
        continue-on-error: false # fail the PR check if JSDoc errors out

      - name: Verify Output & Structure for /docs Path Hosting
        run: |
          if [ ! -d "docs/api/js" ]; then
            echo "::error::JSDoc output directory docs/api/js was not created"
            exit 1
          fi
          FILE_COUNT=$(find docs/api/js -name "*.html" | wc -l)
          echo "JSDoc generated $FILE_COUNT HTML files"
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::warning::JSDoc produced no HTML output — check that app/portal.js has JSDoc comments"
          fi
          echo "✓ Documentation built successfully for GitHub Pages hosting under /docs path"
