name: Publish Versioned Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
    branches:
      - main
    paths:
      - 'app/**'
      - 'api/**'
      - 'data/**'
      - 'pipeline/**'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'The tag name for the release (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish GitHub Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Overlay Data Branches
        uses: ./.github/actions/overlay-data-branches
        with:
          branches: 'data/andhra_pradesh,data/telangana'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Toolchain
        uses: ./.github/actions/setup-pipeline

      - name: Run Data Validator
        run: python pipeline/validate_data.py

      - name: Build Data Archives
        id: prep_release
        run: |
          mkdir -p release-artifacts
          
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            REF_NAME="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            REF_NAME="${github_ref#refs/tags/}"
          else
            # Extract latest semantic version from CHANGELOG.md (e.g., 2.0.0 -> v2.0.0)
            VERSION=$(grep -oE '## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | head -n 1 | tr -d '## []')
            if [ -n "$VERSION" ]; then
              REF_NAME="v$VERSION"
            else
              REF_NAME="v2.0.1"
            fi
          fi
          
          echo "tag_name=$REF_NAME" >> $GITHUB_OUTPUT
          
          # AP data archive
          cd data/andhra_pradesh
          zip -r ../../release-artifacts/crown-corridor-ap-$REF_NAME.zip .
          cd ../..
          
          # TS data archive
          cd data/telangana
          zip -r ../../release-artifacts/crown-corridor-ts-$REF_NAME.zip .
          cd ../..
          
          # Combined archive
          zip -r release-artifacts/crown-corridor-all-$REF_NAME.zip data/
          
          echo "Release artifacts:"
          ls -lh release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.prep_release.outputs.tag_name }}
          name: "Crown Corridor Release ${{ steps.prep_release.outputs.tag_name }}"
          body: |
            ## Crown Corridor Release (${{ steps.prep_release.outputs.tag_name }})
            
            Automated release generated by CrownCorridor CI/CD release workflow.
            
            ### Downloadable Data & Release Archives
            - `crown-corridor-ap-${{ steps.prep_release.outputs.tag_name }}.zip` — Andhra Pradesh geographic & property history datasets
            - `crown-corridor-ts-${{ steps.prep_release.outputs.tag_name }}.zip` — Telangana geographic & property history datasets
            - `crown-corridor-all-${{ steps.prep_release.outputs.tag_name }}.zip` — Combined archive (both states & SRO feeds)
            
            ### Semantic Versioning Rules
            - **`MINOR` (x.Y.0)**: SRO dataset updates & property history expansions (`data/**`).
            - **`PATCH` (x.y.Z)**: Data pipeline, validator, and fast-read search API updates (`pipeline/**`, `api/**`).
            - **`MAJOR` (X.0.0)**: Web application features, layout, and UI frontend updates (`app/**`).
            
            All property datasets are zero-PII compliant and sourced from official state LGD registries.
          files: release-artifacts/*.zip
          draft: false
          prerelease: false
