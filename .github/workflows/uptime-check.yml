name: Synthetic Uptime & Health Check

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: uptime-check
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  uptime-check:
    name: Synthetic Health & API Availability Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Live Site Root & JSON Datasets
        run: |
          TARGET_URL="https://mchittineni.github.io/CrownCorridor/app/"
          AP_META_URL="https://mchittineni.github.io/CrownCorridor/data/andhra_pradesh/meta.json"
          TS_META_URL="https://mchittineni.github.io/CrownCorridor/data/telangana/meta.json"

          echo "Checking $TARGET_URL..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET_URL" || echo "000")
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Uptime check failed for $TARGET_URL (HTTP status: $HTTP_CODE)"
            exit 1
          fi
          echo "✓ $TARGET_URL returned HTTP 200 OK"

          echo "Checking $AP_META_URL..."
          AP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$AP_META_URL" || echo "000")
          if [ "$AP_STATUS" -ne 200 ]; then
            echo "::error::Dataset check failed for $AP_META_URL (HTTP status: $AP_STATUS)"
            exit 1
          fi
          echo "✓ $AP_META_URL returned HTTP 200 OK"

          echo "Checking $TS_META_URL..."
          TS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$TS_META_URL" || echo "000")
          if [ "$TS_STATUS" -ne 200 ]; then
            echo "::error::Dataset check failed for $TS_META_URL (HTTP status: $TS_STATUS)"
            exit 1
          fi
          echo "✓ $TS_META_URL returned HTTP 200 OK"
