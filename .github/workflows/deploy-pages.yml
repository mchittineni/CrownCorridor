name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Site for Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Overlay Data Branches
        uses: ./.github/actions/overlay-data-branches
        with:
          branches: 'data/andhra_pradesh,data/telangana'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Install JSDoc + docdash
        run: npm install --save-dev jsdoc docdash

      - name: Build JSDoc API Reference
        run: npx jsdoc -c jsdoc.json --pedantic

      - name: Assemble Site Root
        # GitHub Pages serves from a single directory.
        # We build a _site/ folder containing app/ + data/ + docs/ so that
        # relative paths resolve correctly.
        run: |
          mkdir -p _site
          cp -r app/ _site/app
          cp -r data/ _site/data
          cp -r docs/ _site/docs
          touch _site/.nojekyll
          # Place a redirect at the site root → /app/
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta http-equiv="refresh" content="0; url=app/" />
              <title>Crown Corridor</title>
            </head>
            <body><a href="app/">Crown Corridor Portal →</a></body>
          </html>
          EOF

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
