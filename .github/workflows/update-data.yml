name: Scheduled Data Update

on:
  schedule:
    - cron: '0 1 * * 0'   # Every Sunday at 01:00 UTC (data.gov.in less busy)
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to fetch (YYYY-MM-DD, defaults to today)'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-data:
    name: Fetch & Refresh SRO Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Dispatch Date
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          set -eu
          if [ -z "$INPUT_DATE" ]; then
            echo "no date supplied; the pipeline will default to today"
            echo "SRO_DATE_FLAG=" >> "$GITHUB_ENV"
            exit 0
          fi
          case "$INPUT_DATE" in
            [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
            *) echo "::error::date must be YYYY-MM-DD"; exit 1 ;;
          esac
          if ! date -u -d "$INPUT_DATE" +%Y-%m-%d >/dev/null 2>&1; then
            echo "::error::date is well-formed but is not a real calendar date"
            exit 1
          fi
          echo "SRO_DATE_FLAG=--date $INPUT_DATE" >> "$GITHUB_ENV"

      - name: Setup Toolchain
        uses: ./.github/actions/setup-pipeline

      - name: Overlay Data Branches
        uses: ./.github/actions/overlay-data-branches
        with:
          branches: 'data/andhra_pradesh,data/telangana'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch AP SRO Records & Generate History
        uses: ./.github/actions/datagov-fetch
        with:
          run-command: >-
            python pipeline/fetch_sro.py
            --state andhra_pradesh
            --dry-run
            --generate-history
            $SRO_DATE_FLAG

      - name: Fetch TS SRO Records & Generate History
        uses: ./.github/actions/datagov-fetch
        with:
          run-command: >-
            python pipeline/fetch_sro.py
            --state telangana
            --dry-run
            --generate-history
            $SRO_DATE_FLAG

      - name: Run Data Validator
        run: python pipeline/validate_data.py

      - name: Sync AP Data Branch
        uses: ./.github/actions/publish-data-branch
        with:
          branch: 'data/andhra_pradesh'
          source-directory: 'data/andhra_pradesh'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync TS Data Branch
        uses: ./.github/actions/publish-data-branch
        with:
          branch: 'data/telangana'
          source-directory: 'data/telangana'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Open Reviewed PR for Updated Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PR_BRANCH="update/sro-data-$(date +'%Y-%m-%d')"
          git checkout -b "$PR_BRANCH"
          git add data/sro_feed/

          if git diff --cached --quiet; then
            echo "No data changes detected. No PR needed."
          else
            git commit -m "data: automated SRO data refresh $(date -u +'%Y-%m-%d')"
            git push -f origin "$PR_BRANCH"
            gh pr create \
              --title "data: scheduled SRO data refresh $(date +'%Y-%m-%d')" \
              --body "Automated weekly refresh of AP & Telangana SRO registration records. Please review before merging to main." \
              --base main \
              --head "$PR_BRANCH" || {
                echo "::warning:: GitHub Actions is not permitted to create pull requests."
                echo "Please enable the permission under 'Settings' -> 'Actions' -> 'General' -> 'Workflow permissions' -> check 'Allow GitHub Actions to create and approve pull requests'."
                echo "Branch $PR_BRANCH has been successfully pushed. You can create the pull request manually."
              }
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
