name: Automated Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Create Release Please PR
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: simple

      - name: Checkout Repository
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Toolchain
        if: ${{ steps.release.outputs.release_created }}
        uses: ./.github/actions/setup-pipeline

      - name: Run Data Validator
        if: ${{ steps.release.outputs.release_created }}
        run: python pipeline/validate_data.py

      - name: Build Benchmark Archives
        if: ${{ steps.release.outputs.release_created }}
        run: |
          REF_NAME="${{ steps.release.outputs.tag_name }}"
          mkdir -p release-artifacts

          # IaCSecBench benchmark dataset & evaluation suite
          zip -r release-artifacts/iacsecbench-$REF_NAME.zip benchmark/ security_framework/ evaluation/ infrastructure/

      - name: Upload Benchmark Archives to Release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.release.outputs.tag_name }}" release-artifacts/*.zip --clobber