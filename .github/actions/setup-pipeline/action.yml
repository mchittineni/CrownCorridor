name: Setup Pipeline Toolchain
description: 'Sets up Python + Node toolchain, caches packages, and installs dependencies'

runs:
  using: 'composite'

  steps:
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5.4.0
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: |
          experiments/requirements.txt

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest-cov ruff black autoflake isort flake8 flake8-pytest-style flake8-bugbear flake8-comprehensions flake8-print darglint 'bandit[toml]' pylint
        pip install -r experiments/requirements.txt
      shell: bash
