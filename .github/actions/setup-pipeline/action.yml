name: Setup Pipeline Toolchain
description: 'Sets up the Python toolchain, caches packages, and installs the gate dependencies'

runs:
  using: 'composite'

  steps:
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5.4.0
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: |
          experiments/requirements.txt

    # The gate tools come from the dev extras in pyproject.toml rather than an
    # inline list, so CI and a contributor's `pip install -e '.[dev]'` cannot drift.
    # The previous list installed black, which no gate here invokes -- ruff-format is
    # the formatter in both ci.yml and .pre-commit-config.yaml.
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[dev]'
        pip install -r experiments/requirements.txt
      shell: bash
