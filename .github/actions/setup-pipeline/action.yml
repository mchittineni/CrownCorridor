name: 'Setup Pipeline Toolchain'
description: 'Sets up Python + Node toolchain, caches packages, and installs dependencies'
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'pipeline/requirements.txt'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r pipeline/requirements.txt
      shell: bash

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
      continue-on-error: true

