name: Setup Pipeline Toolchain
description: 'Sets up Python + Node toolchain, caches packages, and installs dependencies'

runs:
  using: 'composite'
  
  steps:
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5.4.0
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: |
          pipeline/requirements.txt
          api/requirements.txt

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r pipeline/requirements.txt
        if [ -f api/requirements.txt ]; then pip install -r api/requirements.txt; fi
      shell: bash

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.2.0
      with:
        node-version: '24'
      continue-on-error: true

