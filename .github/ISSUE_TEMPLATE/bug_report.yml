name: "🐛 Bug report"

description: Report something in the portal, search, comparison, map, or history calculation that isn't working as expected

labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: "Thanks for taking the time to report this issue! Detailed steps help us fix it quickly."

  - type: dropdown
    id: area
    attributes:
      label: Affected Area / Feature
      options:
        - Global Smart Search
        - Property Sale History & Infrastructure Explorer
        - Side-by-Side Property Comparison Tool
        - Stamp Duty & Guidance Value Calculator
        - Live SRO Ticker Feed
        - Andhra Pradesh Data / Map
        - Telangana Data / Map
        - Developer API Console
        - Other / Not Sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what you did and what went wrong. Include steps to reproduce.
      placeholder: "I selected 'Sea Breeze Heights', clicked 'Export Audit Report', and the printable modal showed empty POIs…"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?

  - type: input
    id: url
    attributes:
      label: Page URL (if relevant)
      placeholder: https://mchittineni.github.io/CrownCorridor/app/

  - type: input
    id: env
    attributes:
      label: Browser & Operating System
      placeholder: "Chrome 124 on macOS / Safari on iPhone / Firefox on Windows…"
