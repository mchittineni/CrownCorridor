[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crowncorridor"
version = "1.0.0"
description = "CrownCorridor Fast-Read API & Data Pipeline for AP & TS Real Estate Records"
authors = [{ name = "CrownCorridor Team" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "typesense>=1.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "anyio>=4.0.0",
    "ruff>=0.1.0",
    "black>=24.0.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --strict-markers"
testpaths = [
    "application/api/tests",
    "evaluation/tests",
    "pipeline/tests",
    "security_framework/tests",
]
# `evaluation/tests/__init__.py` exists but `evaluation/__init__.py` does not, so
# pytest's prepend import mode puts `evaluation/` on sys.path rather than the repo
# root, and `from evaluation.stats import ...` fails. Declaring the root here makes
# collection independent of the ambient sys.path instead of relying on the caller's
# working directory.
pythonpath = ["."]
python_files = [
    "test_*.py",
    "*_test.py",
]
[tool.pyright]
extraPaths = ["application"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501", "UP042", "E402", "N806", "E701"]

# No per-file-ignores. W291/W293 were briefly exempted for
# pipeline/sync_to_obsidian.py, whose Markdown templates encoded hard line breaks
# as two trailing spaces. Exempting ruff was not enough: pre-commit's
# trailing-whitespace hook strips the same characters, and it did, collapsing four
# metadata lines into one paragraph in the published vault. The templates now use
# list markup, which no formatter can damage, so the exemption is unnecessary --
# and an ignore that suggests trailing whitespace is safe here would be misleading,
# because the rest of the toolchain still removes it.

[tool.isort]
profile = "black"
line_length = 100

[tool.black]
line-length = 100
target-version = ['py311']


[tool.flake8]
max-line-length = 112
extend-ignore = ["E203", "E501", "B008", "T201", "DAR101", "DAR201", "DAR401", "E402", "PT018"]
exclude = [".git", ".venv", "__pycache__", "node_modules"]

[tool.bandit]
skips = ["B101", "B404", "B405", "B603"]
exclude_dirs = ["api/tests", "pipeline/tests", "docs/scratch", ".venv"]

[tool.pylint.messages_control]
max-line-length = 112
disable = [
    "C0114", # missing-module-docstring
    "C0115", # missing-class-docstring
    "C0116", # missing-function-docstring
    "C0415", # import-outside-toplevel
    "C0103", # invalid-name
    "R0903", # too-few-public-methods
    "R0902", # too-many-instance-attributes
    "R0912", # too-many-branches
    "R0914", # too-many-locals
    "R0915", # too-many-statements
    "R0801", # duplicate-code
    "W0212", # protected-access
    "C0413", # wrong-import-position
    "E0401", # import-error
    "C0301", # line-too-long
    "C0325", # superfluous-parens
    "R0913", # too-many-arguments
    "R0917", # too-many-positional-arguments
    "W1203", # logging-fstring-interpolation
    "W0707", # raise-missing-from
    "W0718", # broad-exception-caught
    "C1803", # use-implicit-booleaness-not-comparison
    "W0612", # unused-variable
    "R1705", # no-else-return
]
