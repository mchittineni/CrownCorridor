[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crowncorridor"
version = "1.0.0"
description = "CrownCorridor Fast-Read API & Data Pipeline for AP & TS Real Estate Records"
authors = [{ name = "CrownCorridor Team" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "typesense>=1.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "anyio>=4.0.0",
    "ruff>=0.1.0",
    "black>=24.0.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --strict-markers"
testpaths = [
    "api/tests",
    "pipeline/tests",
]
python_files = [
    "test_*.py",
    "*_test.py",
]


[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.flake8]
max-line-length = 112
extend-ignore = ["E203", "E501", "B008", "T201", "DAR101", "DAR201", "DAR401", "E402", "PT018"]
exclude = [".git", ".venv", "__pycache__", "node_modules"]

[tool.bandit]
skips = ["B101"]
exclude_dirs = ["api/tests", "pipeline/tests", ".venv"]


