version: '3.8'

services:
  iacsecbench:
    build:
      context: .
      dockerfile: Dockerfile
    image: iacsecbench:latest
    container_name: iacsecbench_eval
    volumes:
      - .:/app
    # The structural admissibility report, because it is the most useful thing this
    # image can actually run: the Dockerfile installs Python and git but not
    # Checkov, tfsec, Trivy, OPA or Terraform, so the full measurement
    # (experiments/run_baselines.sh) cannot execute here and would report every
    # tool as not_run. The previous command invoked pipeline/run_experiments.py,
    # which left with the application.
    command: python3 -m evaluation.corpus --report --mode structural
